<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Confirmed</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #dbeafe, #eff6ff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: white;
      padding: 50px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
      width: 90%;
      max-width: 500px;
    }

    .box h1 {
      color: #16a34a;
      font-size: 36px;
      margin-bottom: 15px;
    }

    .box p {
      color: #475569;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .box a {
      text-decoration: none;
      background: #0ea5e9;
      color: white;
      padding: 14px 30px;
      border-radius: 12px;
      font-size: 18px;
      display: inline-block;
    }

    .box a:hover {
      background: #0284c7;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Booking Confirmed ✅</h1>
    <p>Your room has been booked successfully.</p>
    <a href="homepage.html">Go to Home</a>
  </div>
</body>
</html>
