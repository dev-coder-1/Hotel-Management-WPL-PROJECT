<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Your Room</title>
  <link rel="stylesheet" href="booking.css" />
</head>
<body>

  <div class="booking-container">
    <div class="booking-left">
      <img id="hotelImage" src="https://images.unsplash.com/photo-1566073771259-6a8506099945" alt="Hotel Room">

      <h2 id="hotelName">Selected Hotel</h2>
      <p class="location" id="hotelLocation">Selected Location</p>

      <div class="room-info">
        <h3 id="roomType">Selected Hotel</h3>
        <p id="hotelRating">⭐ Selected Rating</p>
        <p>✔ King Size Bed</p>
        <p>✔ Free WiFi</p>
        <p>✔ AC Room</p>
        <p>✔ Breakfast Included</p>
        <p>✔ 2 Guests</p>
      </div>

      <div class="price-box">
        <p>Price per night</p>
        <h1 id="hotelPrice">₹ Selected Price</h1>
      </div>
    </div>

    <div class="booking-right">
      <h1>Book Your Stay</h1>
      <p>Fill in your details to confirm your booking.</p>

      <form id="bookingForm">
        <div class="input-group">
          <label>Full Name</label>
          <input type="text" placeholder="Enter your full name" required>
        </div>

        <div class="input-group">
          <label>Email</label>
          <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
          <label>Phone Number</label>
          <input type="tel" placeholder="Enter your phone number" required>
        </div>

        <div class="row">
          <div class="input-group">
            <label>Check-in Date</label>
            <input type="date" required>
          </div>

          <div class="input-group">
            <label>Check-out Date</label>
            <input type="date" required>
          </div>
        </div>

        <div class="row">
          <div class="input-group">
            <label>Guests</label>
            <input type="number" min="1" max="5" value="1" required>
          </div>

          <div class="input-group">
            <label>Room Type</label>
            <select required>
              <option value="">Select Room</option>
              <option>Standard Room</option>
              <option selected>Deluxe Room</option>
              <option>Suite Room</option>
            </select>
          </div>
        </div>

        <div class="input-group">
          <label>Special Request</label>
          <textarea rows="4" placeholder="Any special request..."></textarea>
        </div>

        <button type="submit" class="book-btn">Confirm Booking</button>
      </form>
    </div>
  </div>

  <script src="booking.js"></script>
</body>
</html>
